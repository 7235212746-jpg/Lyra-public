[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-electronic-structure"
version = "0.2.0"
description = "Publication-quality VASP electronic-structure plotting studio"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "Pillow>=10",
    "scikit-image>=0.26",
    "PySide6>=6.11,<7",
]

[project.optional-dependencies]
full = [
    "pymatgen>=2025.6",
    "sumo>=2.4",
]

[project.scripts]
lyra = "lyra.__main__:main"
lyra-check = "lyra.check_cli:main"
lyra-mobile = "lyra.mobile.__main__:main"
lyra-legacy = "lyra.legacy_main:main"
lyra-qt = "lyra.qt_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyra*"]

[tool.setuptools.package-data]
lyra = [
    "assets/*.png",
    "qml/*.qml",
    "remote/*.ps1",
    "resources/incar/*",
    "resources/mobile/*",
]

[tool.pytest.ini_options]
addopts = "--capture=sys"
