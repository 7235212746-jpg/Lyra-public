<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Lyra mobile control">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <title>Lyra Mobile</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">L</span>
      <div><strong>Lyra</strong><small>Mobile</small></div>
    </div>
    <div class="connection"><span id="status-dot" class="dot"></span><span id="connection-text">连接中</span></div>
  </header>

  <main>
    <section id="pair-view" class="view auth-view" hidden>
      <div class="auth-panel">
        <span class="brand-mark large">L</span>
        <h1>连接 Lyra</h1>
        <p>输入电脑端显示的六位配对码</p>
        <form id="pair-form">
          <label>设备名称<input id="device-name" maxlength="80" autocomplete="nickname" value="我的手机" required></label>
          <label>配对码<input id="pair-code" class="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
          <button class="primary full" type="submit">配对</button>
        </form>
        <p id="pair-error" class="error" role="alert"></p>
      </div>
    </section>

    <section id="tasks-view" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">任务</p><h1>计算与绘图</h1></div>
        <button id="refresh-button" class="icon-button" type="button" title="刷新" aria-label="刷新">↻</button>
      </div>
      <div id="summary" class="summary-row">
        <div><strong id="running-count">0</strong><span>运行中</span></div>
        <div><strong id="completed-count">0</strong><span>已完成</span></div>
        <div><strong id="failed-count">0</strong><span>需处理</span></div>
      </div>
      <div id="task-list" class="task-list" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden><strong>暂无任务</strong><span>从下方新建一个计算任务</span></div>
    </section>

    <section id="new-view" class="view" hidden>
      <div class="section-heading"><div><p class="eyebrow">新任务</p><h1>提交计算</h1></div></div>
      <form id="task-form" class="form-panel">
        <label>任务类型
          <select id="task-kind">
            <option value="band">能带</option>
            <option value="dos">态密度</option>
            <option value="combined">能带 + 态密度</option>
          </select>
        </label>
        <label id="single-directory-row">计算目录<select id="directory-id" required></select></label>
        <div id="combined-directory-row" class="range-row" hidden>
          <label>Band 目录<select id="band-directory-id"></select></label>
          <label>DOS 目录<select id="dos-directory-id"></select></label>
        </div>
        <label>读取模式<select id="read-mode"><option value="lite">Lite Mode</option><option value="full">Full Mode</option></select></label>
        <div class="range-row">
          <label>能量下限<input id="energy-min" type="number" step="0.1" value="-5"></label>
          <label>能量上限<input id="energy-max" type="number" step="0.1" value="5"></label>
        </div>
        <button class="primary full" type="submit">创建任务</button>
        <p id="capability-note" class="notice"></p>
        <p id="task-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="device-view" class="view" hidden>
      <div class="section-heading"><div><p class="eyebrow">设备</p><h1>连接管理</h1></div></div>
      <div class="settings-panel">
        <div><span>服务状态</span><strong id="service-state">在线</strong></div>
        <div><span>当前设备</span><strong id="current-device">已配对</strong></div>
        <button id="revoke-button" class="danger" type="button">撤销此设备</button>
      </div>
    </section>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="主导航">
    <button class="active" data-view="tasks-view"><span>●</span>任务</button>
    <button data-view="new-view"><span>＋</span>新建</button>
    <button data-view="device-view"><span>◎</span>设备</button>
  </nav>

  <dialog id="preview-dialog">
    <div class="preview-toolbar">
      <strong id="preview-title">预览</strong>
      <div><button id="zoom-out" class="icon-button" aria-label="缩小">−</button><button id="zoom-in" class="icon-button" aria-label="放大">＋</button><button id="preview-close" class="icon-button" aria-label="关闭">×</button></div>
    </div>
    <div id="preview-stage" class="preview-stage"><img id="preview-image" alt="Lyra 绘图预览"></div>
  </dialog>

  <!-- serviceWorker registration lives in app.js -->
  <script src="/app.js" defer></script>
</body>
</html>
